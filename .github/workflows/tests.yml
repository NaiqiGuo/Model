name: tests

on: [push, pull_request]

jobs:
  spot-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy + pytest: golden spot checks. xara: unit constants for the field
      # recompute. quakeio + mdof: unpickle the bridge event fixture and run
      # get_measurements/extract_channels for the bridge field recompute.
      - run: pip install numpy pytest xara quakeio mdof
      - run: pytest -q
